<!doctype html>
<!-- Headless render guard: loads the shipped card bundle, instantiates every card and every table preset with
     representative fake `hass` data, and lets tests/cards/render.cjs fail the build on any console/page error.
     Open manually in a browser too — each card renders below. -->
<html><head><meta charset="utf-8"><style>
 body{margin:0;padding:16px;font-family:system-ui,sans-serif;background:#eef0f2;
  --primary-text-color:#1b1b1b;--secondary-text-color:#6b6b6b;--divider-color:rgba(0,0,0,.14);
  --card-background-color:#fff;--ha-card-background:#fff;--primary-color:#1e88e5;
  --success-color:#2e7d32;--warning-color:#e67e00;--error-color:#c62828;}
 h3{font:600 12px system-ui;color:#555;margin:14px 0 4px}
 ha-card{display:block;background:#fff;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,.08);border:1px solid var(--divider-color);margin-bottom:10px}
 ha-icon{display:inline-flex}
</style></head><body>
<script src="../../custom_components/milesight_lorawan/frontend/milesight-cards.js"></script>
<div id="root"></div>
<script>
 customElements.define("ha-icon", class extends HTMLElement { connectedCallback(){ this.textContent="□"; }});
 customElements.define("ha-card", class extends HTMLElement {});

 const devs = [];
 for (let i = 0; i < 12; i++) devs.push({
   name: "Dev " + i, model: "EM300-TH", area: i % 2 ? "Field" : "Barn", online: i < 10,
   battery: 60 - i * 4, battery_low: i > 8, battery_days_left: i > 8 ? 10 + i : 120,
   battery_replace_by: "2026-12-01", battery_forecast: "steady", rssi: -100 - i, snr: 7 - i, sf: 7 + (i % 5),
   gateways_heard: 1 + (i % 2), packet_loss: i, signal: i > 8 ? "poor" : "good", firmware: "1." + (i % 3),
   offline_hours: i >= 10 ? 48 : 0, last_seen: "x",
   service: i === 0 ? [{ at: "2026-10-20T08:00:00Z", kind: "firmware", text: "v1.6->v1.7", by: "Sam" }] : [],
 });
 const gws = [{ name: "GW-A", online: true, packets_today: 4000, devices_today: 20 },
              { name: "GW-B", online: false, packets_today: 0, devices_today: 0 }];
 const alerts = [
   { id: "a1", title: "Fridge warm", message: "6.8 °C for 25 min", severity: "critical", category: "cold_chain", since: "22 Oct 14:05", status: "escalated", acknowledged_by: null },
   { id: "a2", title: "Pump dry-run", message: "2.1 A", severity: "warning", category: "pumps", since: "22 Oct 09:10", status: "notified", acknowledged_by: null },
   { id: "a3", title: "Tank low", message: "8% left", severity: "warning", category: "tank", since: "21 Oct", status: "acknowledged", acknowledged_by: "Juan" },
 ];
 const S = {
   "sensor.gw": { state: "online", attributes: { friendly_name: "UG65", eui: "24e124", packets_today: 1200, devices: 20, connection: "MQTT", clock: "synced", last_heard: Date.now() / 1000 } },
   "sensor.temp": { state: "4.2", last_changed: new Date().toISOString(), attributes: { friendly_name: "Fridge", device_class: "temperature", unit_of_measurement: "°C", alarm_low: 2, alarm_high: 8, min_today: 3, max_today: 6 } },
   "sensor.fleet": { state: "12", attributes: { milesight_role: "fleet_total", devices: devs, site: "Acme Farm" } },
   "sensor.gws": { state: "2", attributes: { milesight_role: "net_gateways_online", gateways: gws } },
   "sensor.alo": { state: "2", attributes: { milesight_role: "alerts_open", alerts: alerts, escalation_enabled: true, on_call: ["juan"], backup: ["sam"], snooze_min: 60 } },
   "sensor.health": { state: "89", attributes: { milesight_role: "building_health" } },
   "sensor.bcomfort": { state: "84", attributes: { milesight_role: "building_comfort", areas: 6, comfortable_areas: 5 } },
   "sensor.bair": { state: "Moderate", attributes: { milesight_role: "building_air_quality", score: 72 } },
   "sensor.bpeople": { state: "23", attributes: { milesight_role: "building_people", areas: 6, occupied_areas: 4 } },
   "sensor.bco2": { state: "840", attributes: { milesight_role: "building_avg_co2", unit_of_measurement: "ppm" } },
   "sensor.btemp": { state: "22.4", attributes: { milesight_role: "building_avg_temperature", unit_of_measurement: "°C" } },
   "sensor.bpm": { state: "9", attributes: { milesight_role: "building_avg_pm2_5", unit_of_measurement: "μg/m³" } },
   "sensor.btvoc": { state: "260", attributes: { milesight_role: "building_avg_tvoc", unit_of_measurement: "μg/m³" } },
   "sensor.bhum": { state: "45", attributes: { milesight_role: "building_avg_humidity", unit_of_measurement: "%" } },
   "sensor.retail": { state: "1213", attributes: { milesight_role: "retail", visitors_today: 1213, visitors_yesterday: 1150, in_store_now: 37, out_today: 1176,
     peak_today: 118, peak_today_at: "13:00", avg_dwell: "14m", avg_dwell_s: 840, dwell_source: "estimated", compare_pct: 5, staff_coverage: "6h 12m", staff_coverage_s: 22320,
     hourly_in: [0,0,0,0,0,0,0,20,55,90,120,140,160,150,130,118,95,70,40,15,0,0,0,0],
     hourly_out: [0,0,0,0,0,0,0,8,40,80,110,135,150,150,140,120,100,78,55,30,0,0,0,0],
     entrances: [{ device: "Front door", area: "Store", in: 912, out: 890, net: 22 }, { device: "Mall entrance", area: "Store", in: 301, out: 286, net: 15 }],
     zones: [{ name: "Promo end-cap", area: "Store", avg_dwell_s: 190, avg_dwell: "3m", people_now: 4 }, { name: "Chilled aisle", area: "Store", avg_dwell_s: 144, avg_dwell: "2m", people_now: 2 }],
     staff_zones: [{ name: "Checkout", area: "Store", coverage_s: 22320, coverage: "6h 12m", people_now: 1 }] } },
   "binary_sensor.mains": { state: "off", attributes: { milesight_role: "mains", device: "Main board", area: "Main shed", currents: [18, 16, 19], phase_imbalance: 9, phase_imbalance_high: false, current_total: 53, power_w: 12400 } },
   "binary_sensor.trough1": { state: "on", attributes: { milesight_role: "water_trough", device: "Paddock trough", area: "North paddock", empty: true, since: Date.now() / 1000 - 5400, empty_confirmed: true } },
   "binary_sensor.trough2": { state: "off", attributes: { milesight_role: "water_trough", device: "Barn trough", area: "Barn", empty: false, since: null } },
   "sensor.flood1": { state: "62", attributes: { milesight_role: "flood", device: "Bridge culvert", area: "River Rd", level_cm: 62, rate_cm_h: 14, rising: true, danger: true, danger_cm: 50, empty_distance_mm: 3000 } },
   "sensor.flood2": { state: "18", attributes: { milesight_role: "flood", device: "Storm drain 3", area: "Depot", level_cm: 18, rate_cm_h: 0, rising: false, danger: false, danger_cm: 60, empty_distance_mm: 2000 } },
   "binary_sensor.fence1": { state: "on", attributes: { milesight_role: "electric_fence", device: "North boundary", area: "North paddock", fault: true, since: Date.now() / 1000 - 1200 } },
   "binary_sensor.fence2": { state: "off", attributes: { milesight_role: "electric_fence", device: "Yard perimeter", area: "Yard", fault: false, since: null } },
   "sensor.ld2": { state: "6", attributes: { milesight_role: "load", device: "Packshed lights", purpose_label: "Lighting", area: "Packshed", running: true, duty_today: 60, duty_24h: 35, starts_today: 2, after_hours: true } },
   "sensor.tank1": { state: "1200", attributes: { milesight_role: "tank", device: "Diesel", area: "Yard", fill: 14, low: true, sudden_drop: true, capacity_l: 5000, usage_per_day: 120, days_left: 5, low_pct: 20, free_l: 3800, drop_amount_l: 210, empty_at: Date.now() / 1000 + 5 * 86400, last_refill: Date.now() / 1000 - 4 * 86400, last_refill_added_l: 4000 } },
   "sensor.tank3": { state: "13500", attributes: { milesight_role: "tank", device: "Header tank", area: "Roof", fill: 86, low: false, sudden_drop: false, capacity_l: 16000, usage_per_day: 420, days_left: 20, low_pct: 20, free_l: 2500, last_refill: Date.now() / 1000 - 9 * 86400, last_refill_added_l: 7900 } },
   "sensor.coopwater": { state: "80", attributes: { milesight_role: "tank", device: "Coop water", area: "Chicken coop", fill: 80, low: false, sudden_drop: false, capacity_l: 50, usage_per_day: 8, days_left: 6 } },
   "sensor.pump1": { state: "3", attributes: { milesight_role: "pump", device: "Borehole", running: true, dry_run: true, current: 2.1, normal_current: 9.8, starts_last_hour: 1 } },
   "sensor.pivot1": { state: "running", attributes: { milesight_role: "pivot", device: "Pivot 1", status: "running", angle: 198, speed: 12, finish_in_h: 3.2 } },
   "sensor.load1": { state: "4", attributes: { milesight_role: "load", group: "cold_chain", device: "Compressor", area: "Cold room", running: true, duty_today: 44, duty_24h: 40, starts_today: 12 } },
   "sensor.compliance": { state: "2026-10-18T09:00:00+00:00", attributes: { milesight_role: "compliance_reports", schedule: "every Monday", email: ["a@x", "b@x"], reports: [{ unit: "Fridge 1", period: "last week", status: "compliant", excursions: 0, coverage: 99, url: "/local/x.pdf" }, { unit: "Freezer", period: "last week", status: "attention", excursions: 2, coverage: 97, url: "/local/y.pdf" }] } },
   "text.ca": { state: "door seal replaced", attributes: { milesight_role: "corrective_action", device: "Fridge 1" } },
   "sensor.cc1": { state: "12", attributes: { milesight_role: "cold_chain", device: "Fridge 1", area: "Kitchen", temperature: 9.1, low: 2, high: 8, min_today: 3, max_today: 9, alarm: true, door_open: true, excursions_today: 1, in_range_7d: 96.4,
     log: [{ day: "Mon 17", min: 3, max: 6, out_min: 0, excursions: 0 }, { day: "Tue 18", min: 2, max: 9, out_min: 45, excursions: 1 }, { day: "Wed 19", min: 3, max: 7, out_min: 0, excursions: 0 }, { day: "Thu 20", min: 4, max: 12, out_min: 180, excursions: 3 }] } },
   "sensor.asum": { state: "14", attributes: { milesight_role: "alerts_summary", days: 7, critical: 3, acknowledged: 9, not_acknowledged: 2, escalated: 1, snoozed: 2, mtta_min: 7.5,
     by_category: { cold_chain: 6, pumps: 4, tank: 3, gateways: 1 }, noisiest: [{ source: "Fridge 1", alerts: 5, flaps: 2 }, { source: "Borehole", alerts: 4, flaps: 0 }], on_call_now: ["notify.mobile_app_juan"], escalation_chain: ["notify.mobile_app_sam"] } },
   "sensor.cmf1": { state: "82", attributes: { kind: "comfort", area: "Reception", temperature: 22, humidity: 45, co2: 620 } },
   "sensor.cmf2": { state: "38", attributes: { kind: "comfort", area: "Server room", temperature: 29, humidity: 20, co2: 1340 } },
   "sensor.util1": { state: "on", attributes: { utilisation_today: 63, area: "Reception" } },
   "sensor.level1": { state: "62", last_changed: new Date().toISOString(), attributes: { milesight_role: "tank", device: "Water tank", fill: 62, capacity_l: 10000 } },
 };
 const hass = {
   config: { location_name: "Acme Farm" },
   panels: { "building-acme": { url_path: "building-acme", title: "Acme Farm", icon: "mdi:home" },
             "milesight-maintenance": { url_path: "milesight-maintenance", title: "Maintenance" },
             "milesight-tanks": { url_path: "milesight-tanks", title: "Tanks" } },
   states: S, entities: {}, devices: {},
   callService: () => {}, callWS: () => Promise.resolve({}),
 };

 const root = document.getElementById("root");
 function mount(tag, cfg, label) {
   const h = document.createElement("h3"); h.textContent = label || tag; root.appendChild(h);
   const el = document.createElement(tag);
   try { el.setConfig(cfg || {}); el.hass = hass; } catch (e) { console.error("setConfig " + tag + ": " + e.message); }
   root.appendChild(el);
   return el;
 }

 const cards = [
   ["milesight-gateway-card", { entity: "sensor.gw" }],
   ["milesight-device-card", { entity: "sensor.temp" }],
   ["milesight-trend-card", { entity: "sensor.temp" }],
   ["milesight-level-card", {}],
   ["milesight-gauge-card", { entity: "sensor.temp", min: 0, max: 10, shape: "arc" }],
   ["milesight-page-header", { title: "Maintenance", subtitle: "Health", icon: "mdi:wrench-clock" }],
   ["milesight-onboarding", {}],
   ["milesight-alerts-card", { title: false }],
   ["milesight-coldlog-card", {}],
   ["milesight-alert-summary-card", {}],
   ["milesight-status-band", {}],
   ["milesight-fleet-band", {}],
   ["milesight-coldchain-band", {}],
   ["milesight-building-band", {}],
   ["milesight-air-card", {}],
   ["milesight-retail-band", {}],
   ["milesight-footfall-card", {}],
   ["milesight-zones-card", {}],
   ["milesight-tank-band", {}],
   ["milesight-tank-supply-card", {}],
   ["milesight-trough-card", {}],
   ["milesight-flood-card", {}],
   ["milesight-fence-card", {}],
   ["milesight-compliance-card", {}],
   ["milesight-mains-card", {}],
   ["milesight-load-summary-card", {}],
   ["milesight-domain-card", { domain: "tanks" }],
   ["milesight-domain-card", { domain: "cold_chain" }],
   ["milesight-domain-card", { domain: "farm" }],
   ["milesight-device-panel", { entity: "sensor.temp" }],
 ];
 cards.forEach(([t, c]) => mount(t, c, t));

 ["devices", "offline", "weak", "firmware", "cold_chain", "compressors", "loads", "pumps", "pivots",
  "batteries", "service", "gateways", "tanks", "comfort", "utilisation"].forEach((p) =>
   mount("milesight-table-card", { preset: p, title: false }, "table: " + p));

 // area-scoped (coop page) — filters to one HA area
 mount("milesight-table-card", { preset: "tanks", area: "Chicken coop", title: false }, "table: tanks @ Chicken coop");
 mount("milesight-level-card", { area: "Chicken coop" }, "level @ Chicken coop");

 // also exercise empty states: a hass with no milesight sensors
 const emptyHass = { config: {}, panels: {}, states: {}, entities: {}, devices: {}, callService: () => {} };
 ["batteries", "gateways", "tanks", "comfort"].forEach((p) => {
   const el = document.createElement("milesight-table-card");
   try { el.setConfig({ preset: p, title: false }); el.hass = emptyHass; } catch (e) { console.error("empty " + p + ": " + e.message); }
   root.appendChild(el);
 });
 const al = document.createElement("milesight-alerts-card");
 try { al.setConfig({}); al.hass = emptyHass; } catch (e) { console.error("empty alerts: " + e.message); }
 root.appendChild(al);

 window.__rendered = root.querySelectorAll("*").length;
 window.__cardCount = root.querySelectorAll("[class*='milesight-'],milesight-table-card").length;
 document.title = "rendered";
</script></body></html>
