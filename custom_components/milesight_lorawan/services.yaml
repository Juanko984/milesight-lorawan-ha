send_downlink:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: milesight_lorawan
    payload:
      required: true
      example: "ff10ff"
      selector:
        text:
    fport:
      example: 85
      selector:
        number:
          min: 1
          max: 223
          mode: box
output_command:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: milesight_lorawan
    output:
      required: true
      example: "valve_1"
      selector:
        text:
    action:
      required: true
      selector:
        select:
          options: ["on", "off", "on_for", "off_for", "open_for", "open_until_pulses", "set"]
    value:
      example: 600
      selector:
        number:
          min: 0
          max: 4294967295
          mode: box
display_content:
  fields:
    device_id:
      required: true
      selector:
        device:
          multiple: true
          filter:
            - integration: milesight_lorawan
              model: DS3604
    template:
      default: 1
      selector:
        select:
          options: ["1", "2"]
    text_1:
      example: "Meeting room 1"
      selector:
        text:
    text_2:
      example: "Free"
      selector:
        text:
    text_3:
      example: "Next: 14:00 Board meeting"
      selector:
        text:
    text_4:
      example: "Text 4"
      selector:
        text:
    text_5:
      example: "Text 5"
      selector:
        text:
    text_6:
      example: "Text 6"
      selector:
        text:
    text_7:
      example: "Text 7"
      selector:
        text:
    text_8:
      example: "Text 8"
      selector:
        text:
    text_9:
      example: "Text 9"
      selector:
        text:
    text_10:
      example: "Text 10"
      selector:
        text:
    qrcode:
      example: "https://example.com/book/room-1"
      selector:
        text:
    content:
      example: '{"text_1": "Room 1", "text_2": "Free"}'
      selector:
        object:
    force:
      default: false
      selector:
        boolean:
    show:
      default: true
      selector:
        boolean:
    refresh:
      default: false
      selector:
        boolean:
    beep:
      default: false
      selector:
        boolean:
