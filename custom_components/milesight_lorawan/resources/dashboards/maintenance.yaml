# Milesight LoRaWAN – maintenance: overview, every device, signal & gateways (and, installed by the integration,
# a map of the devices' locations).
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# No entity ids to edit: everything comes from the gateway's sensors.
title: Maintenance
views:
- title: Overview
  path: maintenance
  icon: mdi:wrench-clock
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-onboarding
    - type: custom:milesight-page-header
      grid_options:
        columns: full
      title: Maintenance
      subtitle: Device health, signal and firmware across your fleet
      icon: mdi:wrench-clock
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-dynamic-layout
      id: maintenance-maintenance
      default: packed
      grid_options:
        columns: full
      sections:
      - heading: Fleet health
        icon: mdi:heart-pulse
        cards:
        - type: custom:milesight-fleet-band
      - cards:
        - type: custom:milesight-vibration-card
      - heading: Batteries
        icon: mdi:battery-clock
        cards:
        - type: custom:milesight-table-card
          preset: batteries_due
          title: false
      - heading: Offline more than 24 h or never heard
        icon: mdi:access-point-network-off
        cards:
        - type: custom:milesight-table-card
          preset: offline
          title: false
      - heading: Firmware
        icon: mdi:chip
        cards:
        - type: custom:milesight-table-card
          preset: firmware
          title: false
      - heading: Service history
        icon: mdi:history
        cards:
        - type: custom:milesight-table-card
          preset: service
          title: false
- title: Devices
  path: devices
  icon: mdi:format-list-bulleted
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-page-header
      grid_options:
        columns: full
      title: Devices
      subtitle: Every device on the fleet, with signal, battery and firmware
      icon: mdi:format-list-bulleted
  - type: grid
    column_span: 3
    cards:
    - type: heading
      heading: All devices
      icon: mdi:access-point-network
    - type: custom:milesight-table-card
      preset: devices
      title: false
      grid_options:
        columns: full
- title: Signal
  path: signal
  icon: mdi:signal
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-page-header
      grid_options:
        columns: full
      title: Signal
      subtitle: Gateways and the devices with a weak or lossy link
      icon: mdi:signal
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-dynamic-layout
      id: maintenance-signal
      default: packed
      grid_options:
        columns: full
      sections:
      - heading: Gateways
        icon: mdi:router-wireless
        cards:
        - type: custom:milesight-table-card
          preset: gateways
          title: false
      - heading: Weak or lossy devices
        icon: mdi:signal-cellular-1
        cards:
        - type: custom:milesight-table-card
          preset: weak
          title: false
        - type: markdown
          content: '<small>Move the device or gateway, add an antenna or a second gateway. Run a walk test from *Commissioning*. Link margin = SNR above what the spreading factor needs.</small>

            '
- title: Device
  path: device
  subview: true
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:milesight-device-panel
