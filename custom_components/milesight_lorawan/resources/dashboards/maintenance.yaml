# Milesight LoRaWAN – maintenance: overview, every device, signal & gateways (and, installed by the integration,
# a map of the devices' locations).
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# No entity ids to edit: everything comes from the gateway's sensors.
title: Maintenance
views:
  - title: Overview
    path: maintenance
    icon: mdi:wrench-clock
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set devs = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'fleet_total') | map(attribute='attributes.devices') | sum(start=[]) %}
              {% set due = devs | selectattr('battery_days_left', 'ne', none) | selectattr('battery_days_left', 'le', 90) | list %}
              {% set off = devs | selectattr('offline_hours', 'ne', none) | selectattr('offline_hours', 'ge', 24) | list %}
              {% set weak = devs | selectattr('signal', 'in', ['poor', 'bad', 'very_poor']) | list %}
              **{{ devs | count }} devices** · 🔋 {{ due | count }} batteries due in 90 days · 📴 {{ off | count }} offline > 24 h · 📶 {{ weak | count }} weak signal
      - type: grid
        cards:
          - type: heading
            heading: Batteries
            icon: mdi:battery-clock
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set devs = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'fleet_total') | map(attribute='attributes.devices') | sum(start=[]) %}
              {% set rows = devs | selectattr('battery', 'ne', none) | list %}
              {% set due = rows | selectattr('battery_days_left', 'ne', none) | sort(attribute='battery_days_left') | list %}
              {% set low = rows | selectattr('battery_low') | rejectattr('battery_days_left', 'ne', none) | list %}
              {% if not due and not low %}No battery forecasts yet – they appear after two weeks of readings.{% endif %}
              {% for d in low + due %}{% set n = d.battery_days_left %}
              {{ '🔴' if d.battery_low or (n is not none and n <= 30) else ('🟠' if n is not none and n <= 90 else '🟢') }} **{{ d.name }}**{{ ' · ' ~ d.area if d.area else '' }} · {{ d.battery }} %  
              <small>{% if n is not none %}replace by **{{ d.battery_replace_by }}** ({{ n }} days){% else %}low now{% endif %}{% if d.battery_forecast %} · {{ d.battery_forecast }}{% endif %}</small>

              {% endfor %}
              {% set waiting = rows | selectattr('battery_days_left', 'none') | rejectattr('battery_low') | list %}
              {% if waiting %}<small>No forecast yet: {{ waiting | map(attribute='name') | join(', ') }}</small>{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Offline more than 24 h or never heard
            icon: mdi:access-point-network-off
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set devs = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'fleet_total') | map(attribute='attributes.devices') | sum(start=[]) %}
              {% set off = devs | selectattr('offline_hours', 'ne', none) | selectattr('offline_hours', 'ge', 24) | sort(attribute='offline_hours', reverse=true) | list %}
              {% if not off %}Every device reported in the last 24 hours ✅{% else %}
              {% for d in off %}📴 **{{ d.name }}**{{ ' · ' ~ d.area if d.area else '' }} · {{ d.model }}  
              <small>silent for {{ (d.offline_hours / 24) | round(1) }} days · last seen {{ as_timestamp(d.last_seen) | timestamp_custom('%d %b %H:%M') if d.last_seen else 'never' }}{% if d.battery is not none %} · battery {{ d.battery }} %{% endif %}</small>

              {% endfor %}{% endif %}
              {% set never = devs | selectattr('last_seen', 'none') | list %}
              {% if never %}

              **Never heard since they were added ({{ never | count }})** – check the device is on, joined, and that its gateway application forwards to Home Assistant (MQTT):
              {% for d in never %}❔ {{ d.name }} · {{ d.model }}{{ ' · ' ~ d.area if d.area else '' }}  
              {% endfor %}{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Firmware
            icon: mdi:chip
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set devs = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'fleet_total') | map(attribute='attributes.devices') | sum(start=[]) %}
              {% set models = devs | map(attribute='model') | unique | sort | list %}
              {% for m in models %}{% set ds = devs | selectattr('model', 'eq', m) | list %}{% set vers = ds | selectattr('firmware') | map(attribute='firmware') | unique | sort | list %}
              **{{ m }}** · {{ ds | count }} device(s) · {% if not vers %}firmware not reported yet{% elif vers | count == 1 %}all on {{ vers[0] }} ✅{% else %}⚠ mixed: {% for v in vers %}{{ v }} ({{ ds | selectattr('firmware', 'eq', v) | list | count }}){{ ', ' if not loop.last }}{% endfor %}{% endif %}  
              {% if vers | count > 1 %}<small>Older than {{ vers[-1] }}: {{ ds | selectattr('firmware') | rejectattr('firmware', 'eq', vers[-1]) | map(attribute='name') | join(', ') }}</small>  
              {% endif %}
              {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Service history
            icon: mdi:history
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set devs = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'fleet_total') | map(attribute='attributes.devices') | sum(start=[]) %}
              {% set ns = namespace(items=[]) %}
              {% for d in devs %}{% for e in d.service or [] %}{% set ns.items = ns.items + [dict(e, name=d.name)] %}{% endfor %}{% endfor %}
              {% if not ns.items %}No service entries yet. Battery replacements and firmware changes are logged by themselves; add notes with the *Log service* action (milesight_lorawan.log_service).{% else %}
              {% for e in ns.items | sort(attribute='at', reverse=true) %}{% if loop.index <= 20 %}{{ {'battery_replaced': '🔋', 'firmware': '💾', 'profile': '📋', 'maintenance': '🔧'}.get(e.kind, '📝') }} **{{ e.name }}** · {{ as_timestamp(e.at) | timestamp_custom('%d %b %Y') }}  
              <small>{{ e.text }}{% if e.by %} · {{ e.by }}{% endif %}</small>

              {% endif %}{% endfor %}{% endif %}
  - title: Devices
    path: devices
    icon: mdi:format-list-bulleted
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: All devices
            icon: mdi:access-point-network
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set devs = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'fleet_total') | map(attribute='attributes.devices') | sum(start=[]) %}
              {% set icon = {'excellent': '🟢', 'good': '🟢', 'fair': '🟠', 'poor': '🔴'} %}
              {% if not devs %}No devices yet.{% endif %}
              {% for d in devs | sort(attribute='name') %}{{ '🟢' if d.online else '🔴' }} **{{ d.name }}** · {{ d.model }}{{ ' · ' ~ d.area if d.area else '' }}{{ ' · ' ~ d.purpose if d.purpose else '' }}  
              <small>{% if d.battery is not none %}🔋 {{ d.battery }} %{% if d.battery_replace_by %} (due {{ d.battery_replace_by }}){% endif %} · {% endif %}{{ icon.get(d.signal, '⚪') }} {{ d.signal or 'no signal data' }}{% if d.rssi is not none %} · {{ d.rssi }} dBm / {{ d.snr }} dB · SF{{ d.sf }}{% endif %}{% if d.gateways_heard %} · {{ d.gateways_heard }} gw{% endif %}{% if d.packet_loss %} · {{ d.packet_loss }} % lost{% endif %}  
              {{ d.network_server or '' }}{% if d.firmware %} · fw {{ d.firmware }}{% endif %}{% if d.command %} · last command {{ d.command }}{% endif %} · last seen {{ as_timestamp(d.last_seen) | timestamp_custom('%d %b %H:%M') if d.last_seen else 'never' }}{% if d.latitude is not none and d.latitude is defined %} · 📍{% endif %}</small>

              {% endfor %}
  - title: Signal
    path: signal
    icon: mdi:signal
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Gateways
            icon: mdi:router-wireless
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set gws = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'net_gateways_online')
                 | map(attribute='attributes.gateways') | sum(start=[]) | list %}
              {% if not gws %}No gateways seen yet – they appear with the first uplink that lists them.{% else %}
              {% for g in gws | sort(attribute='name') %}{{ '🟢' if g.online else ('🔴' if g.online is false else '⚪') }} **{{ g.name }}**  
              <small>{{ g.packets_today }} packets · {{ g.devices_today }} devices today</small>

              {% endfor %}{% endif %}
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Weak or lossy devices
            icon: mdi:signal-cellular-1
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set devs = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'fleet_total') | map(attribute='attributes.devices') | sum(start=[]) %}
              {% set bad = devs | selectattr('signal', 'in', ['poor', 'fair']) | list
                 + (devs | selectattr('packet_loss', 'defined') | rejectattr('packet_loss', 'none') | selectattr('packet_loss', 'ge', 10) | list) %}
              {% if not bad %}All devices have a good link ✅{% else %}
              {% for d in bad | unique(attribute='deveui') | sort(attribute='name') %}{{ '🔴' if d.signal == 'poor' else '🟠' }} **{{ d.name }}**{{ ' · ' ~ d.area if d.area else '' }} · {{ d.signal or '–' }}  
              <small>RSSI {{ d.rssi }} dBm · SNR {{ d.snr }} dB · SF{{ d.sf }} · {{ d.gateways_heard or 0 }} gateway(s){% if d.packet_loss %} · {{ d.packet_loss }} % lost today{% endif %}{% if d.gateway %} · best {{ d.gateway }}{% endif %}</small>

              {% endfor %}
              <small>Move the device or gateway, add an antenna or a second gateway. Run a walk test from *LoRaWAN commissioning*.</small>{% endif %}
              <small>🟢 good / excellent · 🟠 fair · 🔴 poor (link margin = SNR above what the spreading factor needs)</small>
