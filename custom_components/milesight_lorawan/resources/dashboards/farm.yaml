# Milesight LoRaWAN – pumps, pivots and irrigation
# Installed by the integration. No entity ids to edit: the cards find the devices themselves. A "Live" view with
# gauges, sliders, history graphs (and the pivot map) for the site's actual devices is added in front.
title: Farm
views:
  - title: Overview
    path: farm
    icon: mdi:tractor-variant
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-page-header
            title: Farm
            subtitle: Pumps, pivots and irrigation
            icon: mdi:tractor-variant
      - type: grid
        cards:
          - type: heading
            heading: Irrigation and frost
            icon: mdi:sprinkler-variant
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set adv = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'irrigation') | list %}
              {% set frost = states.binary_sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'frost') | list %}
              {% if not adv %}Set up the forecast on the gateway: Configure → Irrigation and frost.{% endif %}
              {% for f in frost %}{% if f.state == 'on' %}<ha-alert alert-type="error" title="Frost tonight – {{ f.attributes.site }}">Forecast low {{ f.attributes.forecast_low }} °C{% if f.attributes.low_at %} around {{ as_timestamp(f.attributes.low_at) | timestamp_custom('%H:%M') }}{% endif %}.</ha-alert>{% elif f.attributes.expected %}<ha-alert alert-type="warning">Frost expected tomorrow morning ({{ f.attributes.forecast_low }} °C) – warning from the afternoon.</ha-alert>{% endif %}
              {% endfor %}
              {% for s in adv %}{% set a = s.attributes %}
              <ha-alert alert-type="{{ 'info' if s.state == 'irrigate' else 'success' }}" title="{{ a.site }}: {{ 'Irrigate' ~ ((' about ' ~ a.minutes ~ ' min') if a.minutes else '') if s.state == 'irrigate' else ('Skip irrigation' if s.state == 'skip' else 'No advice yet') }}">{{ a.reason }}</ha-alert>

              {% set m = a.soil_moisture %}{% if m is not none %}{% set n = (m / 10) | round(0, 'floor') | int %}Soil {{ '🟫' * n }}{{ '⬜' * (10 - n) }} **{{ m }} %** <small>(target {{ a.target_moisture }} %)</small>
              {% endif %}<small>Rain next {{ a.rain_window_h }} h: {{ a.rain_mm if a.rain_mm is not none else '–' }} mm{% if a.rain_probability is not none %} ({{ a.rain_probability }} %){% endif %}{% if a.forecast_error %} · ⚠ {{ a.forecast_error }}{% endif %}</small>
              {% endfor %}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Pumps
            icon: mdi:pump
          - type: custom:milesight-table-card
            preset: pumps
            title: false
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Centre pivots
            icon: mdi:rotate-right
          - type: custom:milesight-table-card
            preset: pivots
            title: false
            grid_options: {columns: full}
