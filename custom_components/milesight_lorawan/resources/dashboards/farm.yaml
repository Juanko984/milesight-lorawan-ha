# Milesight LoRaWAN – pumps, pivots and irrigation
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# No entity ids to edit: the cards find the pumps (current clamp → Configure → Pump), pivots (AT101 → Configure →
# Centre pivot) and the gateway's irrigation advice (gateway → Configure → Irrigation and frost) themselves.
title: Farm
views:
  - title: Farm
    path: farm
    cards:
      - type: markdown
        title: Irrigation and frost
        content: |
          {% set adv = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'irrigation') | list %}
          {% set frost = states.binary_sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'frost') | list %}
          {% if not adv %}Set up the forecast on the gateway: Configure → Irrigation and frost.{% endif %}
          {% for f in frost %}{% if f.state == 'on' %}<ha-alert alert-type="error" title="Frost tonight – {{ f.attributes.site }}">Forecast low {{ f.attributes.forecast_low }} °C{% if f.attributes.low_at %} around {{ as_timestamp(f.attributes.low_at) | timestamp_custom('%H:%M') }}{% endif %}.</ha-alert>{% elif f.attributes.expected %}<ha-alert alert-type="warning">Frost expected tomorrow morning ({{ f.attributes.forecast_low }} °C) – warning from the afternoon.</ha-alert>{% endif %}
          {% endfor %}
          {% for s in adv %}{% set a = s.attributes %}
          **{{ a.site }}: {{ '💧 Irrigate' if s.state == 'irrigate' else ('⏭ Skip' if s.state == 'skip' else '–') }}**{% if s.state == 'irrigate' %} about {{ a.minutes }} min{% endif %} – {{ a.reason }}

          Soil {{ a.soil_moisture if a.soil_moisture is not none else '–' }} % (target {{ a.target_moisture }} %) · rain next {{ a.rain_window_h }} h: {{ a.rain_mm if a.rain_mm is not none else '–' }} mm{% if a.rain_probability is not none %} ({{ a.rain_probability }} %){% endif %}{% if a.forecast_error %} · ⚠ {{ a.forecast_error }}{% endif %}
          {% endfor %}
      - type: markdown
        title: Pumps
        content: |
          {% set pumps = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'pump') | list %}
          {% if not pumps %}No pumps yet – open a current clamp's device (CT101 / CT103 / CT303 …) → Configure → Pump.{% else %}
          | | Pump | Area | Now | Current (normal) | Starts / h | Run hours |
          |---|---|---|---|---|---|---|
          {% for p in pumps | sort(attribute='attributes.device') %}{% set a = p.attributes %}| {{ '🔴' if a.dry_run or a.overload else ('🟠' if a.short_cycling else '🟢') }} | {{ a.device }} | {{ a.area or '' }} | {{ 'running' if a.running else 'off' }}{{ ' · DRY-RUN' if a.dry_run else '' }}{{ ' · OVERLOAD' if a.overload else '' }} | {{ a.current if a.current is not none else '–' }} A ({{ a.normal_current if a.normal_current is not none else 'learning' }}) | {{ a.starts_last_hour }}{{ ' ⚠' if a.short_cycling else '' }} | {{ p.state if p.state not in ('unknown', 'unavailable') else '–' }} |
          {% endfor %}

          🟢 OK · 🟠 short-cycling · 🔴 dry-run or overload{% endif %}
      - type: markdown
        title: Centre pivots
        content: |
          {% set pivots = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'pivot') | list %}
          {% if not pivots %}No pivots yet – open the AT101 on the end tower → Configure → Centre pivot.{% else %}
          | | Pivot | Status | Angle | Round done | Speed | Finishes in |
          |---|---|---|---|---|---|---|
          {% for p in pivots | sort(attribute='attributes.device') %}{% set a = p.attributes %}| {{ '🔴' if a.status == 'stalled' else ('🟢' if a.status == 'running' else '⚪') }} | {{ a.device }} | {{ a.status or '–' }} | {{ a.angle | round(0) | int if a.angle is not none else '–' }}° | {{ p.state if p.state not in ('unknown', 'unavailable') else '–' }} % | {{ a.speed if a.speed else '–' }} °/h | {{ (a.finish_in_h | round(1)) ~ ' h' if a.finish_in_h is not none else '–' }} |
          {% endfor %}

          🔴 stalled – press the pivot's *Pivot stopped (end round)* button if it was stopped on purpose{% endif %}
