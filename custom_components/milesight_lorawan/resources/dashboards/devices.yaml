# Milesight LoRaWAN – Devices: a single, always-visible page listing every device on the fleet, with quick
# filters, sortable columns, row highlighting and a click-through to each device's page.
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# No entity ids to edit: everything comes from the gateway's sensors.
title: Devices
views:
- title: Devices
  path: devices
  icon: mdi:format-list-bulleted
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-onboarding
    - type: custom:milesight-page-header
      grid_options:
        columns: full
      title: Devices
      subtitle: Every device on the fleet — battery, last update, signal and firmware
      icon: mdi:format-list-bulleted
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-recipe-strip-card
      category:
      - devices
      grid_options:
        columns: full
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-dynamic-layout
      id: devices-devices
      default: packed
      grid_options:
        columns: full
      sections:
      - heading: Gateway
        icon: mdi:router-wireless
        cards:
        - type: custom:milesight-gateways-card
      - heading: Fleet health
        icon: mdi:heart-pulse
        cards:
        - type: custom:milesight-fleet-band
      - heading: Asset trackers
        icon: mdi:map-marker-radius
        cards:
        - type: custom:milesight-tracker-card
      - heading: Presence & motion
        icon: mdi:motion-sensor
        cards:
        - type: custom:milesight-presence-card
      - heading: All devices
        icon: mdi:access-point-network
        cards:
        - type: custom:milesight-table-card
          preset: devices
          title: false
- title: Device
  path: device
  subview: true
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: custom:milesight-device-panel
