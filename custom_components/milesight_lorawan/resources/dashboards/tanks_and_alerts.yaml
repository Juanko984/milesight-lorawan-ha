# Milesight LoRaWAN – tanks, silos and alerts
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# No entity ids to edit: the cards find the devices themselves. Installed by the integration, a "Live" view with
# gauges, sliders, history graphs (and the pivot map) for the site's actual devices is added in front.
title: Tanks & alerts
views:
  - title: Overview
    path: tanks
    icon: mdi:storage-tank
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Open alerts
            icon: mdi:bell-alert
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set al = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'alerts_open')
                 | map(attribute='attributes.alerts') | sum(start=[]) | list %}
              {% if not al %}<ha-alert alert-type="success">No open alerts</ha-alert>{% else %}
              {% for a in al %}<ha-alert alert-type="{{ 'error' if a.severity == 'critical' else 'warning' }}" title="{{ a.title }}">{{ a.message }}<br><small>since {{ a.since }} · {{ a.status }}{% if a.acknowledged_by %} by {{ a.acknowledged_by }}{% endif %}</small></ha-alert>
              {% endfor %}{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Tanks and silos
            icon: mdi:storage-tank
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set tanks = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'tank') | list %}
              {% if not tanks %}No tanks yet – open a level sensor's device → Configure → Tank or silo.{% else %}
              {% for t in tanks | sort(attribute='attributes.device') %}{% set a = t.attributes %}{% set f = a.fill | int(0) if a.fill is not none else none %}
              {{ '🔴' if a.sudden_drop else ('🟠' if a.low else '🟢') }} **{{ a.device }}**{{ ' · ' ~ a.area if a.area else '' }}{{ ' · SUDDEN DROP' if a.sudden_drop else (' · LOW' if a.low else '') }}  
              {% if f is not none %}{% set n = (f / 10) | round(0, 'floor') | int %}{{ ('🟥' if a.low or a.sudden_drop else '🟦') * n }}{{ '⬜' * (10 - n) }} **{{ f }} %**{% else %}no reading yet{% endif %}  
              <small>{{ t.state if t.state not in ('unknown', 'unavailable') else '–' }} of {{ a.capacity_l | round(0) | int }} L{% if a.usage_per_day is not none %} · uses {{ a.usage_per_day | round(0) | int }} L/day{% endif %}{% if a.days_left is not none %} · {{ a.days_left }} days left{% endif %}</small>

              {% endfor %}
              <small>🟢 OK · 🟠 low · 🔴 sudden drop (theft or leak) – press the tank's *Clear sudden-drop alarm* button once checked</small>{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Devices on the gateway
            icon: mdi:router-wireless
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set gw = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'net_registered') | list %}
              {% if not gw %}Set up gateway → Configure → Add devices to the gateway, then press *Sync devices with gateway*.{% else %}
              {% for g in gw %}{% if g.state in ('unknown', 'unavailable') %}**{{ g.attributes.site }}**: not read yet – press *Sync devices with gateway* on the gateway device (it also syncs by itself every 6 hours).{% else %}**{{ g.state }} devices** registered on {{ g.attributes.site }}  
              <small>last sync {{ as_timestamp(g.attributes.last_sync) | timestamp_custom('%d %b %H:%M') if g.attributes.last_sync else 'never' }}</small>{% endif %}{% if g.attributes.error %}<ha-alert alert-type="warning">{{ g.attributes.error }}</ha-alert>{% endif %}

              {% set missing = (g.attributes.devices or []) | rejectattr('in_home_assistant') | list %}
              {% if missing %}Not in Home Assistant yet (Settings → Devices & services → Discovered):
              {% for d in missing %}- {{ d.name or '' }} `{{ d.deveui | upper }}`
              {% endfor %}{% elif g.state not in ('unknown', 'unavailable') %}All registered devices are in Home Assistant ✅{% endif %}
              {% endfor %}{% endif %}
