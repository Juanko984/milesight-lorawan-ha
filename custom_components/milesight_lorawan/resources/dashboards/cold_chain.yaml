# Milesight LoRaWAN – cold storage (fridges, freezers, cold rooms)
# Installed by the integration when a device is fitted to a fridge / freezer (device → Configure → Purpose).
# The cards find the probes, door contacts and compressor clamps themselves – no entity ids to edit.
title: Cold storage
views:
  - title: Units
    path: cold-chain
    icon: mdi:fridge-outline
    cards:
      - type: custom:milesight-page-header
        title: Cold chain
        subtitle: Fridge and freezer temperatures and excursions
        icon: mdi:snowflake-thermometer
      - type: custom:milesight-table-card
        preset: cold_chain
      - type: markdown
        title: Cold-chain log (last 7 days)
        content: |
          {% set t = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'cold_chain') | list %}
          {% for s in t | sort(attribute='attributes.device') %}{% set a = s.attributes %}
          **{{ a.device }}**{{ ' · ' ~ a.area if a.area else '' }}

          | Day | Min | Max | Out of range | Excursions |
          |---|---|---|---|---|
          {% for d in (a.log or [])[-7:] | reverse %}| {{ d.day }} | {{ d.min }} °C | {{ d.max }} °C | {{ d.out_min }} min | {{ d.excursions }} |
          {% endfor %}
          {% endfor %}
          The full 31 days are in each probe's *Time out of range today* attribute (log) and in the history.
  - title: Compressors
    path: compressors
    icon: mdi:heat-pump-outline
    cards:
      - type: custom:milesight-page-header
        title: Compressors
        subtitle: Compressor duty and short-cycling
        icon: mdi:heat-pump-outline
      - type: custom:milesight-table-card
        preset: compressors
      - type: markdown
        content: |
          <small>A compressor at 90–100 % duty or never stopping means it cannot keep up (door, seals, gas,
          condenser); one that has not run for hours has tripped or failed.</small>
