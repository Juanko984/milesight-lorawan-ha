# Milesight LoRaWAN – power & energy (air conditioners, lighting, geysers, compressors, motors, mains)
# Installed by the integration when a clamp or socket is given an energy / HVAC purpose (device → Configure → Purpose).
# No entity ids to edit: the cards find the loads and the mains board themselves.
title: Energy & HVAC
views:
  - title: Power
    path: loads
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-page-header
            grid_options: {columns: full}
            title: Power & Energy
            subtitle: Mains, demand and every load
            icon: mdi:lightning-bolt
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Demand
            icon: mdi:gauge
          - type: custom:milesight-load-summary-card
            title: false
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Mains board
            icon: mdi:transmission-tower
          # Live / outage, the three phase currents, phase imbalance and total load — from a CT303 / CT310.
          - type: custom:milesight-mains-card
            title: false
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Loads
            icon: mdi:power-plug
          - type: custom:milesight-table-card
            preset: loads
            title: false
            grid_options: {columns: full}
          - type: markdown
            grid_options: {columns: full}
            content: |
              <small>A red row ran too long or has not run · amber for after-hours or service due.</small>
