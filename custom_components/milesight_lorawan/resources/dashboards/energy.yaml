# Milesight LoRaWAN – energy & HVAC (air conditioners, lighting, geysers, compressors, motors, mains)
# Installed by the integration when a clamp or socket is given an energy / HVAC purpose (device → Configure → Purpose).
title: Energy & HVAC
views:
  - title: Loads
    path: loads
    icon: mdi:lightning-bolt
    cards:
      - type: custom:milesight-page-header
        grid_options: {columns: full}
        title: Energy
        subtitle: Consumption and demand across the site
        icon: mdi:lightning-bolt
      - type: custom:milesight-table-card
        preset: loads
      - type: markdown
        content: |
          <small>🌙 on outside working hours · 🔧 service due · a red row ran too long or has not run.</small>
      - type: markdown
        title: Mains
        content: |
          {% set m = states.binary_sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'mains') | list %}
          {% if not m %}Fit a CT303 / CT310 on the distribution board → Configure → Purpose → Mains for outage and phase-imbalance alerts.{% endif %}
          {% for s in m %}{% set a = s.attributes %}{% if s.state == 'on' %}<ha-alert alert-type="error" title="{{ a.device }} – power outage">{{ a.area or '' }}{% if a.phase_imbalance is defined and a.phase_imbalance is not none %} · phase imbalance {{ a.phase_imbalance }} %{% endif %}</ha-alert>{% else %}<ha-alert alert-type="success" title="{{ a.device }} – power on">{{ a.area or '' }}{% if a.currents is defined %} · {{ a.currents | join(' / ') }} A{% endif %}</ha-alert>{% endif %}
          {% endfor %}
