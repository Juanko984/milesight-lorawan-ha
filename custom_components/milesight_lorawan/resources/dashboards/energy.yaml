# Milesight LoRaWAN – energy & HVAC (air conditioners, lighting, geysers, compressors, motors, mains)
# Installed by the integration when a clamp or socket is given an energy / HVAC purpose (device → Configure → Purpose).
title: Energy & HVAC
views:
  - title: Loads
    path: loads
    cards:
      - type: markdown
        title: Loads
        content: |
          {% set l = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'load') | list %}
          {% if not l %}No loads yet – a CT clamp or smart socket → Configure → Purpose (air conditioner, lighting, geyser, compressor …).{% else %}
          | | Load | What | Area | Now | Run today | Duty 24 h | Starts |
          |---|---|---|---|---|---|---|---|
          {% for s in l | sort(attribute='attributes.device') %}{% set a = s.attributes %}| {{ '🔴' if a.ran_too_long or a.not_running else ('🌙' if a.after_hours else ('🔧' if a.service_due else '🟢')) }} | {{ a.device }}{{ ' ch ' ~ a.channel if a.channel else '' }} | {{ a.purpose_label or '' }} | {{ a.area or '' }} | {{ 'on' if a.running else 'off' }} | {{ s.state if s.state not in ('unknown', 'unavailable') else '–' }} h | {{ a.duty_24h if a.duty_24h is not none else '–' }} % | {{ a.starts_today }} |
          {% endfor %}

          🌙 on outside working hours · 🔧 service due · 🔴 running too long / not running{% endif %}
      - type: markdown
        title: Mains
        content: |
          {% set m = states.binary_sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'mains') | list %}
          {% if not m %}Fit a CT303 / CT310 on the distribution board → Configure → Purpose → Mains for outage and phase-imbalance alerts.{% endif %}
          {% for s in m %}{% set a = s.attributes %}- **{{ a.device }}**{{ ' · ' ~ a.area if a.area else '' }}: {{ '⚠ POWER OUTAGE' if s.state == 'on' else 'power on' }}{% if a.phase_imbalance is defined and a.phase_imbalance is not none %} · phase imbalance {{ a.phase_imbalance }} %{% endif %}{% if a.currents is defined %} ({{ a.currents | join(' / ') }} A){% endif %}
          {% endfor %}
