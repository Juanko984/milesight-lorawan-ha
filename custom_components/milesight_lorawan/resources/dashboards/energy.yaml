# Milesight LoRaWAN – power & energy (air conditioners, lighting, geysers, compressors, motors, mains)
# Installed by the integration when a clamp or socket is given an energy / HVAC purpose (device → Configure → Purpose).
# No entity ids to edit: the cards find the loads and the mains board themselves.
title: Energy & HVAC
views:
- title: Power
  path: loads
  icon: mdi:lightning-bolt
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-page-header
      grid_options:
        columns: full
      title: Power & Energy
      subtitle: Mains, demand and every load
      icon: mdi:lightning-bolt
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-recipe-strip-card
      category:
      - energy
      grid_options:
        columns: full
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-dynamic-layout
      id: energy-loads
      default: packed
      grid_options:
        columns: full
      sections:
      - heading: Running costs
        icon: mdi:cash-multiple
        cards:
        - type: custom:milesight-running-costs-card
          title: false
      - heading: Demand
        icon: mdi:gauge
        cards:
        - type: custom:milesight-load-summary-card
          title: false
      - heading: Mains board
        icon: mdi:transmission-tower
        cards:
        - type: custom:milesight-mains-card
          title: false
      - heading: Current clamps
        icon: mdi:flash
        cards:
        - type: custom:milesight-energy-card
      - heading: Thermostats
        icon: mdi:thermostat
        cards:
        - type: custom:milesight-climate-card
      - heading: Lights & switches
        icon: mdi:lightbulb-group
        cards:
        - type: custom:milesight-light-card
      - heading: Loads
        icon: mdi:power-plug
        cards:
        - type: custom:milesight-table-card
          preset: loads
          title: false
        - type: markdown
          content: '<small>A red row ran too long or has not run · amber for after-hours or service due.</small>

            '
