# Milesight LoRaWAN – Chicken coop
# Set up each coop device two ways and this page fills itself in:
#   1. Purpose (device → Configure → Purpose): Coop drinker (water), Coop feeder (feed), Coop pop-hole / door,
#      Coop climate (temp / CO₂ / humidity). These set poultry-friendly alert defaults (frost at 2 °C, pop-hole
#      left-open 15 min) and make this page install itself.
#   2. Area: put those same devices (plus the EM500-LGT light sensor and the UC relay for lights / heater) in a
#      Home Assistant area called "Chicken coop". Every card below finds the devices by that area NAME (not its id),
#      so there is nothing to edit. Using a different area name? Change every `area: Chicken coop` below to match.
# Lights and heating are automated by the two coop blueprints (Settings → Automations → Blueprints → Import).
#
# LAYOUT: the sections below live inside one milesight-dynamic-layout card. It flows each heading + its widget into a
# space-filling masonry ("Packed") so same-size widgets sit side by side instead of each taking a full-width row.
# The Packed ⇄ Rows toggle in the card's top-right switches back to the classic one-per-row layout; the choice is
# remembered per dashboard. Sections whose devices aren't set up still hide their widget, same as before.
title: Chicken coop
views:
  - title: Coop
    path: coop
    icon: mdi:egg
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-page-header
            grid_options: {columns: full}
            title: Chicken coop
            subtitle: Climate, light, feed, water and the pop-hole door
            icon: mdi:egg
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-dynamic-layout
            id: coop
            default: packed
            grid_options: {columns: full}
            sections:
              - heading: At a glance
                icon: mdi:view-dashboard-outline
                # One KPI tile per coop reading — comfort, temperature (+ today's min/max), humidity, CO₂, ammonia
                # (NH₃), light, water & feed level, flock growth and the pop-hole — coloured against its safe range.
                # Each tile hides when its sensor isn't set up.
                cards:
                  - type: custom:milesight-insights-card
                    area: Chicken coop
                    purpose: coop_climate,coop_door,coop_drinker,coop_feeder,coop_light,flock_growth
              - heading: Climate
                icon: mdi:home-thermometer
                # AM air monitor(s) in the coop (AM107 …): a chip per property (temp / humidity / CO₂ / light) that
                # drives the trend; and EM300 temp / humidity / door / leak sensors. Each hides when there are none.
                cards:
                  - type: custom:milesight-air-quality-card
                    area: Chicken coop
                    purpose: coop_climate
                  - type: custom:milesight-environment-card
                    area: Chicken coop
                    purpose: coop_climate,coop_door
              - heading: Air quality — ammonia & odour
                icon: mdi:scent
                # A GS301 odour detector (NH₃ / H₂S): each gas is a chip that drives the trend. Ammonia from droppings
                # is the key coop air risk. Found by the coop area OR a coop purpose; hides when there is none.
                cards:
                  - type: custom:milesight-gas-card
                    area: Chicken coop
                    purpose: coop_climate
              - heading: CO₂ trend
                icon: mdi:molecule-co2
                # One trendline per CO₂ sensor in the coop — flashes when CO₂ climbs over its limit.
                cards:
                  - type: custom:milesight-trendline-grid-card
                    trend: air
                    area: Chicken coop
                    purpose: coop_climate
                    columns: 2
              - heading: Light level
                icon: mdi:brightness-6
                # One trendline per light sensor in the coop (EM500-LGT, AM light, UC analog light).
                cards:
                  - type: custom:milesight-trendline-grid-card
                    trend: light
                    area: Chicken coop
                    purpose: coop_light
                    columns: 2
                    empty:
                      icon: mdi:lightbulb-off-outline
                      title: No light sensor in the coop yet
                      hint: Put an EM500-LGT (or an AM monitor's light channel) in the Chicken coop area, or set its purpose to Coop light sensor, and it shows here.
              - heading: Controller readings
                icon: mdi:developer-board
                # A UC300 / UC50x in the coop: every PT100 / analog input (and any counter) is a chip that drives the
                # trend, with a digital I/O strip. RS485 channels are not shown here (they have their own entities).
                cards:
                  - type: custom:milesight-controller-sensors-card
                    area: Chicken coop
                    purpose: coop_controller
              - heading: Flock growth
                icon: mdi:bird
                # An EM400-MUD / EM500-UDL on the coop roof over the birds (Flock growth purpose + mount height):
                # flock-top height (daily median) with the growth rate, total growth and age. "New flock" resets it.
                cards:
                  - type: custom:milesight-growth-card
                    area: Chicken coop
                    purpose: flock_growth
              - heading: Feed & water
                icon: mdi:silo
                # Drinkers / feeders set up as a tank or silo: the same cutaway model and supply table as the Water
                # page, scoped to the coop. Hide themselves until there is a tank here.
                cards:
                  - type: custom:milesight-level-model-card
                    area: Chicken coop
                  - type: custom:milesight-table-card
                    preset: tanks
                    title: false
                    area: Chicken coop
              - heading: Pop-hole door
                icon: mdi:door
                # The pop-hole contact (WS301 / EM300-MCS): live Open / Closed, how long open, today's open count and
                # the longest open — found by the coop area or the Coop pop-hole purpose.
                cards:
                  - type: custom:milesight-door-card
                    area: Chicken coop
                    purpose: coop_door
                    empty:
                      icon: mdi:door
                      title: No pop-hole contact in the coop yet
                      hint: Add a magnet contact (WS301 / EM300-MCS), put it in the Chicken coop area or set its purpose to Coop pop-hole, and its state and open history show here.
              - heading: Lights & heater — automatic
                icon: mdi:home-lightning-bolt
                # The gateway runs the coop lights (by daylight) and heater (by temperature) itself: pick the UC relay
                # and the sensor for each, set the thresholds, and it switches them. The heater turns off if its probe
                # stops reporting. `area` keeps the relay / sensor pickers to coop devices only.
                cards:
                  - type: custom:milesight-coop-control-card
                    area: Chicken coop
