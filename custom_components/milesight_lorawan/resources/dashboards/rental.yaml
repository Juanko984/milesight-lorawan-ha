# Milesight LoRaWAN – Short-stay / Airbnb property monitor
# Set up each property's devices two ways and this page fills itself in:
#   1. Purpose (device → Configure → Purpose): Guest front door / entry, Guest occupancy (people count / presence),
#      Rental climate, Rental air quality, Rental noise / nuisance, Rental safety (gas / smoke / leak). These set
#      guest-friendly alert defaults (front door left-open 10 min, calmer CO₂ limits) and make this page install itself.
#      Every widget below finds its devices by these purposes, so set the purpose on each device you add.
#   2. Area: put all of a property's devices in a Home Assistant area named after the property (e.g. "The Vineyard
#      Cottage"). Each property then shows as its own card at the top and its own labelled block in the sections below.
#
# OUT-OF-THE-BOX FEATURES (computed in the cards from the devices you already have):
#   • Stay-state machine — Vacant → Checked in → Occupied → Checked out → Turnover, inferred from occupancy + the door.
#   • Party & smoking risk — one 0–100 score blended from noise, CO₂ rise, people-vs-booking and the GS601 vape sensor.
#   • Over-capacity alert — people over the booked count (set the people counter's Capacity).
#   • Guest-activity timeline — door opens, arrivals and CO₂ peaks over the last day.
#   • Auto-eco HVAC — import the "Short-stay auto-eco HVAC" blueprint: Comfort while occupied, Eco when vacant.
#
# LAYOUT: sections live inside one milesight-dynamic-layout card (Packed ⇄ Rows toggle, remembered per dashboard).
title: Short-stay
views:
  - title: Short-stay
    path: short-stay
    icon: mdi:home-city
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-page-header
            grid_options: {columns: full}
            title: Short-stay properties
            subtitle: Guest-ready · comfort · safety · house-rules — every property at a glance
            icon: mdi:home-city
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-dynamic-layout
            id: rental
            default: packed
            grid_options: {columns: full}
            sections:
              - heading: Stay status
                icon: mdi:bell-ring-outline
                # The stay-state machine for the whole rental: Vacant → Checked in → Occupied → Checked out →
                # Turnover, with the combined guest count (all people counters) and the booking you enter here.
                cards:
                  - type: custom:milesight-property-card
                    mode: detail
                    section: stay
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
              - heading: At a glance
                icon: mdi:view-grid-outline
                # Occupancy (vs booking), front door, air (CO₂), climate, noise and a safety roll-up — each coloured.
                cards:
                  - type: custom:milesight-property-card
                    mode: detail
                    section: kpi
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
              - heading: Party & smoking watch
                icon: mdi:party-popper
                # The composite risk ring + bars: noise, CO₂ rise, people-vs-booking and the vape sensor in one signal.
                cards:
                  - type: custom:milesight-property-card
                    mode: detail
                    section: risk
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
              - heading: Guest activity
                icon: mdi:timeline-clock-outline
                # The last day: door opens, arrivals / departures and CO₂ peaks, newest first, with a live "now" row.
                cards:
                  - type: custom:milesight-property-card
                    mode: detail
                    section: timeline
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
              - heading: Occupancy
                icon: mdi:account-group
                # The VS people counter (inside now, in / out / net today, capacity) and any presence / PIR sensors.
                cards:
                  - type: custom:milesight-people-counter-card
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
                  - type: custom:milesight-occupancy-card
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
              - heading: Air & comfort
                icon: mdi:air-filter
                # The AM air monitor (CO₂ / PM / TVOC / temp / humidity) and any EM300 temp/humidity/door/leak sensors.
                cards:
                  - type: custom:milesight-air-quality-card
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
                  - type: custom:milesight-environment-card
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
              - heading: Climate control
                icon: mdi:thermostat
                # The WT thermostat: current temp, −/+ setpoint, mode and fan, valve opening and a temperature trend.
                # Set the thermostat's purpose to "Rental climate control (thermostat / HVAC)" so it shows here.
                # Pair with the "Short-stay auto-eco HVAC" blueprint for Comfort-while-occupied / Eco-when-vacant.
                cards:
                  - type: custom:milesight-climate-card
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
              - heading: Noise
                icon: mdi:volume-high
                # The WS302 sound-level sensor: live dB with a learned baseline and 'left running' / nuisance detection.
                cards:
                  - type: custom:milesight-sound-card
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
              - heading: Safety
                icon: mdi:shield-home
                # Gas leak (GS101 shut-off valve + relay), smoke / vape (GS601), water leak and the front-door contact.
                cards:
                  - type: custom:milesight-gas-detector-card
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
                  - type: custom:milesight-gas-card
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
                  - type: custom:milesight-door-card
                    purpose: guest_door,guest_occupancy,rental_climate,rental_hvac,rental_air,rental_noise,rental_safety
                    empty:
                      icon: mdi:door
                      title: No door / leak contact yet
                      hint: Add a magnet contact (WS301 / EM300-MCS) or a leak detector, set its purpose to Guest front door or Rental safety, and it shows here.
