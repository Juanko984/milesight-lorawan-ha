# Milesight LoRaWAN – Alerts dashboard (always installed)
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# The one place for every alert: open alerts (acknowledge / snooze), the 7-day summary, and the gateway's
# escalation / notification setup. Cards self-discover the gateway's alert sensors — no entity ids to edit.
title: Alerts
views:
  - title: Alerts
    path: alerts
    icon: mdi:bell-ring
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-page-header
            grid_options: {columns: full}
            title: Alerts
            subtitle: Every alert, who's on call, and how the site is notified — one place
            icon: mdi:bell-ring
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Status
            icon: mdi:gauge
          - type: custom:milesight-alerts-band
            grid_options: {columns: full}
      # The 7-day summary and the escalation / notification setup, as two equal half-width widgets
      # that line up side by side (each carries its own title, so no separate heading row to misalign).
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Summary and setup
            icon: mdi:chart-timeline-variant
          - type: custom:milesight-alert-summary-card
            title: Last 7 days
            grid_options: {columns: 6}
          - type: custom:milesight-escalation-card
            title: Escalation and notifications
            grid_options: {columns: 6}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Open alerts
            icon: mdi:bell-ring
          # Live open alerts with acknowledge / snooze and who is on call (the same actions as the phone push).
          - type: custom:milesight-alerts-card
            title: false
            grid_options: {columns: full}
