# Milesight LoRaWAN – fleet overview dashboard
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# No entity ids to edit: the cards find the gateway's sensors themselves (all gateways together).
title: LoRaWAN fleet
views:
  - title: Fleet
    path: fleet
    cards:
      - type: markdown
        content: |
          {% set devs = states.sensor | selectattr('attributes.milesight_role', 'eq', 'fleet_total') | map(attribute='attributes.devices') | sum(start=[]) %}
          {% set on = devs | selectattr('online') | list | count %}
          ## {{ devs | count }} devices · 🟢 {{ on }} online · 🔴 {{ devs | count - on }} offline · 🪫 {{ devs | selectattr('battery_low') | list | count }} low battery
      - type: markdown
        title: Needs attention
        content: |
          {% set devs = states.sensor | selectattr('attributes.milesight_role', 'eq', 'fleet_total') | map(attribute='attributes.devices') | sum(start=[]) %}
          {% set bad = devs | selectattr('online', 'false') | list + (devs | selectattr('battery_low') | list) %}
          {% if not bad %}All devices are online with good batteries ✅{% else %}
          | Device | Area | Problem | Last seen |
          |---|---|---|---|
          {% for d in bad | unique(attribute='deveui') %}| {{ d.name }} | {{ d.area or '' }} | {{ 'offline' if not d.online else 'battery ' ~ d.battery ~ ' %' }} | {{ as_timestamp(d.last_seen) | timestamp_custom('%d %b %H:%M') if d.last_seen else 'never' }} |
          {% endfor %}{% endif %}
      - type: markdown
        title: All devices
        content: |
          {% set devs = states.sensor | selectattr('attributes.milesight_role', 'eq', 'fleet_total') | map(attribute='attributes.devices') | sum(start=[]) %}
          | | Device | Model | Area | Battery | RSSI | SNR | Last seen |
          |---|---|---|---|---|---|---|---|
          {% for d in devs | sort(attribute='name') %}| {{ '🟢' if d.online else '🔴' }} | {{ d.name }} | {{ d.model }} | {{ d.area or '' }} | {{ (d.battery ~ ' %') if d.battery is not none else '–' }} | {{ d.rssi if d.rssi is not none else '' }} | {{ d.snr if d.snr is not none else '' }} | {{ as_timestamp(d.last_seen) | timestamp_custom('%d %b %H:%M') if d.last_seen else 'never' }} |
          {% endfor %}
