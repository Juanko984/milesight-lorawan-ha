blueprint:
  name: Milesight – Leak detected
  description: "Leak detected: notify (and optionally close a valve) when a leak sensor triggers (EM300-SLD / ZLD / MLD, WS303)."
  domain: automation
  source_url: https://github.com/Juanko984/milesight-lorawan-ha/blob/main/blueprints/automation/milesight_lorawan/leak.yaml
  input:
    sensors:
      name: Sensors
      selector:
        entity:
          multiple: true
          filter:
            - integration: milesight_lorawan
              domain: binary_sensor
              device_class: moisture
    delay:
      name: Only if still on after
      default: 0
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
    actions:
      name: Actions
      default:
        - action: persistent_notification.create
          data:
            title: "Leak detected"
            message: "Leak detected at {{ device_name }}!"
      selector:
        action: {}
    cleared_actions:
      name: When it clears (optional)
      default: []
      selector:
        action: {}
mode: queued
max: 50
trigger:
  - trigger: state
    entity_id: !input sensors
    from: "off"
    to: "on"
    for:
      minutes: !input delay
    id: "on"
  - trigger: state
    entity_id: !input sensors
    from: "on"
    to: "off"
    id: "off"
variables:
  device_name: "{{ device_attr(trigger.entity_id, 'name_by_user') or device_attr(trigger.entity_id, 'name') }}"
  alarm_name: "{{ state_attr(trigger.entity_id, 'friendly_name') }}"
action:
  - choose:
      - conditions: "{{ trigger.id == 'on' }}"
        sequence: !input actions
      - conditions: "{{ trigger.id == 'off' }}"
        sequence: !input cleared_actions
