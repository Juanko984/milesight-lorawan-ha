blueprint:
  name: Milesight – battery low
  description: Notify when a Milesight LoRaWAN device reports a low battery (threshold set per device under Configure).
  domain: automation
  source_url: https://github.com/Juanko984/milesight-lorawan-ha/blob/main/blueprints/automation/milesight_lorawan/battery_low.yaml
  input:
    sensors:
      name: Battery low sensors
      selector:
        entity:
          multiple: true
          filter:
            - integration: milesight_lorawan
              domain: binary_sensor
              device_class: battery
    actions:
      name: Actions
      default:
        - action: persistent_notification.create
          data:
            title: "Replace battery"
            message: "{{ device_name }}: battery {{ battery }} %."
      selector:
        action: {}
mode: queued
max: 50
trigger:
  - trigger: state
    entity_id: !input sensors
    from: "off"
    to: "on"
variables:
  device_name: "{{ device_attr(trigger.entity_id, 'name_by_user') or device_attr(trigger.entity_id, 'name') }}"
  battery: >
    {% set b = device_entities(device_id(trigger.entity_id)) | select('search', '_battery$') | list %}
    {{ states(b[0]) if b else '?' }}
action: !input actions
