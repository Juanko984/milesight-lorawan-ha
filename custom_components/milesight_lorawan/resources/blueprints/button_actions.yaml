blueprint:
  name: Milesight – button actions
  description: Run different actions for short, double and long presses of a Milesight button (WS101, WS156, WS136, DS3604, WT401 keys).
  domain: automation
  source_url: https://github.com/Juanko984/milesight-lorawan-ha/blob/main/blueprints/automation/milesight_lorawan/button_actions.yaml
  input:
    button:
      name: Button
      selector:
        entity:
          filter:
            - integration: milesight_lorawan
              domain: event
    short_press:
      name: Short press / press / single click
      default: []
      selector:
        action: {}
    double_press:
      name: Double press / double click
      default: []
      selector:
        action: {}
    long_press:
      name: Long press
      default: []
      selector:
        action: {}
mode: queued
trigger:
  - trigger: state
    entity_id: !input button
    not_to: ["unavailable", "unknown"]
variables:
  press: "{{ trigger.to_state.attributes.event_type }}"
condition: "{{ trigger.from_state is not none and trigger.from_state.state not in ['unavailable'] }}"
action:
  - choose:
      - conditions: "{{ press in ['short_press', 'press', 'single_click'] }}"
        sequence: !input short_press
      - conditions: "{{ press in ['double_press', 'double_click'] }}"
        sequence: !input double_press
      - conditions: "{{ press == 'long_press' }}"
        sequence: !input long_press
