blueprint:
  name: Milesight – command not confirmed
  description: >
    Notify when a command or setting sent to a Milesight LoRaWAN device fails – the device did not answer
    after the configured retries, or rejected it (e.g. DS3604 text too long). Optionally also when a command
    is confirmed.
  domain: automation
  source_url: https://github.com/Juanko984/milesight-lorawan-ha/blob/main/blueprints/automation/milesight_lorawan/command_failed.yaml
  input:
    include_confirmed:
      name: Also notify when confirmed
      default: false
      selector:
        boolean: {}
    actions:
      name: Actions
      default:
        - action: persistent_notification.create
          data:
            title: "LoRaWAN command {{ trigger.event.data.status }}"
            message: >-
              {{ trigger.event.data.device }}: {{ trigger.event.data.command | replace('_', ' ') }} –
              {{ trigger.event.data.status }} ({{ trigger.event.data.detail }}, {{ trigger.event.data.attempts }}
              attempt(s)).
      selector:
        action: {}
mode: queued
max: 50
variables:
  include_confirmed: !input include_confirmed
trigger:
  - trigger: event
    event_type: milesight_lorawan_command
condition:
  - condition: template
    value_template: >-
      {{ trigger.event.data.status == 'failed' or (include_confirmed and trigger.event.data.status == 'confirmed') }}
action: !input actions
