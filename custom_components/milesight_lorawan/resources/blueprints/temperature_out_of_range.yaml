blueprint:
  name: Milesight – temperature out of range
  description: Fridge / freezer / server room watch – notify when a temperature stays outside a range (TS, EM, AM, WT …).
  domain: automation
  source_url: https://github.com/Juanko984/milesight-lorawan-ha/blob/main/blueprints/automation/milesight_lorawan/temperature_out_of_range.yaml
  input:
    sensors:
      name: Temperature sensors
      selector:
        entity:
          multiple: true
          filter:
            - integration: milesight_lorawan
              domain: sensor
              device_class: temperature
    low:
      name: Too cold below
      default: 2
      selector:
        number: {min: -50, max: 50, step: 0.5, unit_of_measurement: "°C", mode: box}
    high:
      name: Too warm above
      default: 8
      selector:
        number: {min: -50, max: 100, step: 0.5, unit_of_measurement: "°C", mode: box}
    minutes:
      name: For at least
      default: 15
      selector:
        number: {min: 0, max: 240, unit_of_measurement: min}
    actions:
      name: Actions
      default:
        - action: persistent_notification.create
          data:
            title: "Temperature alarm"
            message: "{{ device_name }}: {{ trigger.to_state.state }} °C"
      selector:
        action: {}
mode: queued
max: 50
trigger:
  - trigger: numeric_state
    entity_id: !input sensors
    below: !input low
    for: {minutes: !input minutes}
  - trigger: numeric_state
    entity_id: !input sensors
    above: !input high
    for: {minutes: !input minutes}
variables:
  device_name: "{{ device_attr(trigger.entity_id, 'name_by_user') or device_attr(trigger.entity_id, 'name') }}"
action: !input actions
