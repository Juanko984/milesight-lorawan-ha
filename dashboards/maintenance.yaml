# Milesight LoRaWAN – maintenance: overview, every device, signal & gateways (and, installed by the integration,
# a map of the devices' locations).
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# No entity ids to edit: everything comes from the gateway's sensors.
title: Maintenance
views:
  - title: Overview
    path: maintenance
    icon: mdi:wrench-clock
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          # First-run setup checklist – hides itself once the gateway, devices, data and purposes are in place.
          - type: custom:milesight-onboarding
          - type: custom:milesight-page-header
            title: Maintenance
            subtitle: Device health, signal and firmware across your fleet
            icon: mdi:wrench-clock
      - type: grid
        column_span: 3
        cards:
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set devs = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'fleet_total') | map(attribute='attributes.devices') | sum(start=[]) %}
              {% set due = devs | selectattr('battery_days_left', 'ne', none) | selectattr('battery_days_left', 'le', 90) | list %}
              {% set off = devs | selectattr('offline_hours', 'ne', none) | selectattr('offline_hours', 'ge', 24) | list %}
              {% set weak = devs | selectattr('signal', 'in', ['poor', 'bad', 'very_poor']) | list %}
              **{{ devs | count }} devices** · 🔋 {{ due | count }} batteries due in 90 days · 📴 {{ off | count }} offline > 24 h · 📶 {{ weak | count }} weak signal
      - type: grid
        cards:
          - type: heading
            heading: Batteries
            icon: mdi:battery-clock
          - type: custom:milesight-table-card
            preset: batteries
            title: false
            grid_options: {columns: full}
      - type: grid
        cards:
          - type: heading
            heading: Offline more than 24 h or never heard
            icon: mdi:access-point-network-off
          - type: custom:milesight-table-card
            preset: offline
            title: false
            grid_options: {columns: full}
      - type: grid
        cards:
          - type: heading
            heading: Firmware
            icon: mdi:chip
          - type: custom:milesight-table-card
            preset: firmware
            title: false
            grid_options: {columns: full}
      - type: grid
        cards:
          - type: heading
            heading: Service history
            icon: mdi:history
          - type: custom:milesight-table-card
            preset: service
            title: false
            grid_options: {columns: full}
  - title: Devices
    path: devices
    icon: mdi:format-list-bulleted
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-page-header
            title: Devices
            subtitle: Every device on the fleet, with signal, battery and firmware
            icon: mdi:format-list-bulleted
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: All devices
            icon: mdi:access-point-network
          # A sortable table that faintly tints a row red when a device is offline and amber when its battery is
          # low, and emphasises any cell past its threshold (weak RSSI/SNR, high spreading factor, packet loss).
          - type: custom:milesight-table-card
            preset: devices
            title: false
            grid_options: {columns: full}
  - title: Signal
    path: signal
    icon: mdi:signal
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-page-header
            title: Signal
            subtitle: Gateways and the devices with a weak or lossy link
            icon: mdi:signal
      - type: grid
        cards:
          - type: heading
            heading: Gateways
            icon: mdi:router-wireless
          - type: custom:milesight-table-card
            preset: gateways
            title: false
            grid_options: {columns: full}
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Weak or lossy devices
            icon: mdi:signal-cellular-1
          - type: custom:milesight-table-card
            preset: weak
            title: false
            grid_options: {columns: full}
          - type: markdown
            grid_options: {columns: full}
            content: |
              <small>Move the device or gateway, add an antenna or a second gateway. Run a walk test from *LoRaWAN commissioning*. Link margin = SNR above what the spreading factor needs.</small>
  # Per-device page: opened when you click a device in the tables above (a sub-view, so it has a back button and
  # no tab of its own). The panel reads ?device=<id> from the URL and lays itself out by the device's type.
  - title: Device
    path: device
    subview: true
    type: sections
    max_columns: 2
    sections:
      - type: grid
        column_span: 2
        cards:
          - type: custom:milesight-device-panel
