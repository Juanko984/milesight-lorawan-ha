# Milesight LoRaWAN – cold storage (fridges, freezers, cold rooms)
# Installed by the integration when a device is fitted to a fridge / freezer (device → Configure → Purpose).
# The cards find the probes, door contacts and compressor clamps themselves – no entity ids to edit.
# One page, like the Coop and Building pages: a page header, then every section inside one dynamic-layout card
# (Packed ⇄ Rows toggle, top-right). Compliance and compressor duty are sections here now, not separate tabs.
title: Cold storage
views:
- title: Overview
  path: cold-chain
  icon: mdi:snowflake-thermometer
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-page-header
      grid_options: {columns: full}
      title: Cold storage
      subtitle: Temperatures, excursions, compliance and compressor duty
      icon: mdi:snowflake-thermometer
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-recipe-strip-card
      category: [cold_chain]
      grid_options: {columns: full}
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-dynamic-layout
      id: cold_chain-cold-chain
      default: packed
      grid_options: {columns: full}
      sections:
      - heading: Cold chain status
        icon: mdi:snowflake-thermometer
        cards:
        - type: custom:milesight-coldchain-band
      - heading: Units
        icon: mdi:fridge-outline
        cards:
        - type: custom:milesight-table-card
          preset: cold_chain
          title: false
        - type: custom:milesight-coldlog-card
          title: false
      - heading: Temperature trends
        icon: mdi:chart-line
        cards:
        - type: custom:milesight-trendline-grid-card
          trend: cold_chain
          columns: 2
      - heading: Temperature probes
        icon: mdi:thermometer
        cards:
        - type: custom:milesight-temp-probe-card
      - heading: Environment sensors
        icon: mdi:home-thermometer
        cards:
        - type: custom:milesight-environment-card
      - heading: Compressors
        icon: mdi:heat-pump-outline
        # Compressor duty and short-cycling (CT clamps fitted to a fridge / freezer). 90–100 % duty or never
        # stopping means it can't keep up (door, seals, gas, condenser); hours with no run means it has tripped.
        cards:
        - type: custom:milesight-table-card
          preset: compressors
          title: false
      - heading: Compliance
        icon: mdi:file-certificate-outline
        # Time in range, PDF reports and corrective actions.
        cards:
        - type: custom:milesight-compliance-card
          title: false
