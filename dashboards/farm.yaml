# Milesight LoRaWAN – pumps, pivots and irrigation
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# No entity ids to edit: the cards find the devices themselves. Installed by the integration, a "Live" view with
# gauges, sliders, history graphs (and the pivot map) for the site's actual devices is added in front.
title: Farm
views:
  - title: Overview
    path: farm
    icon: mdi:tractor-variant
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Irrigation and frost
            icon: mdi:sprinkler-variant
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set adv = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'irrigation') | list %}
              {% set frost = states.binary_sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'frost') | list %}
              {% if not adv %}Set up the forecast on the gateway: Configure → Irrigation and frost.{% endif %}
              {% for f in frost %}{% if f.state == 'on' %}<ha-alert alert-type="error" title="Frost tonight – {{ f.attributes.site }}">Forecast low {{ f.attributes.forecast_low }} °C{% if f.attributes.low_at %} around {{ as_timestamp(f.attributes.low_at) | timestamp_custom('%H:%M') }}{% endif %}.</ha-alert>{% elif f.attributes.expected %}<ha-alert alert-type="warning">Frost expected tomorrow morning ({{ f.attributes.forecast_low }} °C) – warning from the afternoon.</ha-alert>{% endif %}
              {% endfor %}
              {% for s in adv %}{% set a = s.attributes %}
              <ha-alert alert-type="{{ 'info' if s.state == 'irrigate' else 'success' }}" title="{{ a.site }}: {{ 'Irrigate' ~ ((' about ' ~ a.minutes ~ ' min') if a.minutes else '') if s.state == 'irrigate' else ('Skip irrigation' if s.state == 'skip' else 'No advice yet') }}">{{ a.reason }}</ha-alert>

              {% set m = a.soil_moisture %}{% if m is not none %}{% set n = (m / 10) | round(0, 'floor') | int %}Soil {{ '🟫' * n }}{{ '⬜' * (10 - n) }} **{{ m }} %** <small>(target {{ a.target_moisture }} %)</small>  
              {% endif %}<small>Rain next {{ a.rain_window_h }} h: {{ a.rain_mm if a.rain_mm is not none else '–' }} mm{% if a.rain_probability is not none %} ({{ a.rain_probability }} %){% endif %}{% if a.forecast_error %} · ⚠ {{ a.forecast_error }}{% endif %}</small>
              {% endfor %}
      - type: grid
        cards:
          - type: heading
            heading: Pumps
            icon: mdi:pump
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set pumps = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'pump') | list %}
              {% if not pumps %}No pumps yet – open a current clamp's device (CT101 / CT103 / CT303 …) → Configure → Pump.{% else %}
              {% for p in pumps | sort(attribute='attributes.device') %}{% set a = p.attributes %}
              {{ '🔴' if a.dry_run or a.overload else ('🟠' if a.short_cycling else '🟢') }} **{{ a.device }}**{{ ' · ' ~ a.area if a.area else '' }} · {{ '▶️ running' if a.running else '⏹ off' }}{{ ' · **DRY-RUN**' if a.dry_run else '' }}{{ ' · **OVERLOAD**' if a.overload else '' }}  
              <small>{{ a.current if a.current is not none else '–' }} A (normal {{ a.normal_current if a.normal_current is not none else 'learning' }}) · {{ a.starts_last_hour }} starts this hour{{ ' ⚠ short-cycling' if a.short_cycling else '' }} · {{ p.state if p.state not in ('unknown', 'unavailable') else '–' }} run hours</small>

              {% endfor %}
              <small>🟢 OK · 🟠 short-cycling · 🔴 dry-run or overload</small>{% endif %}
      - type: grid
        cards:
          - type: heading
            heading: Centre pivots
            icon: mdi:rotate-right
          - type: markdown
            grid_options: {columns: full}
            content: |
              {% set pivots = states.sensor | selectattr('attributes.milesight_role', 'defined') | selectattr('attributes.milesight_role', 'eq', 'pivot') | list %}
              {% if not pivots %}No pivots yet – open the AT101 on the end tower → Configure → Centre pivot.{% else %}
              {% for p in pivots | sort(attribute='attributes.device') %}{% set a = p.attributes %}{% set d = p.state | int(-1) %}
              {{ '🔴' if a.status == 'stalled' else ('🟢' if a.status == 'running' else '⚪') }} **{{ a.device }}** · {{ a.status or '–' }}  
              {% if d >= 0 %}{% set n = (d / 10) | round(0, 'floor') | int %}{{ '🟩' * n }}{{ '⬜' * (10 - n) }} **{{ d }} %** of the round{% endif %}  
              <small>angle {{ a.angle | round(0) | int if a.angle is not none else '–' }}° · {{ a.speed if a.speed else '–' }} °/h{% if a.finish_in_h is not none %} · finishes in {{ a.finish_in_h | round(1) }} h{% endif %}</small>

              {% endfor %}
              <small>🔴 stalled – press the pivot's *Pivot stopped (end round)* button if it was stopped on purpose</small>{% endif %}
