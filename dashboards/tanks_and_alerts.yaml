# Milesight LoRaWAN – water level (tanks, silos, dams) and alerts
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# No entity ids to edit: the cards find the devices themselves. Installed by the integration, a "Live" view with
# per-tank gauges, sliders and the 30-day level history for the site's actual tanks is added after this Overview.
title: Water
views:
- title: Overview
  path: tanks
  icon: mdi:water-percent
  type: sections
  max_columns: 3
  sections:
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-page-header
      grid_options:
        columns: full
      title: Water
      subtitle: Levels, days of supply, usage and leaks across your water and fuel tanks
      icon: mdi:water-percent
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-level-model-card
      grid_options:
        columns: full
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-liquid-level-card
      grid_options:
        columns: full
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-recipe-strip-card
      category:
      - water
      grid_options:
        columns: full
  - type: grid
    column_span: 3
    cards:
    - type: custom:milesight-dynamic-layout
      id: tanks_and_alerts-tanks
      default: packed
      grid_options:
        columns: full
      sections:
      - heading: Supply at a glance
        icon: mdi:view-dashboard-outline
        cards:
        - type: custom:milesight-tank-band
      - heading: Running cost today
        icon: mdi:cash-multiple
        cards:
        - type: custom:milesight-cost-strip-card
          resources:
          - water
          - diesel
          - feed
      - heading: Tanks
        icon: mdi:storage-tank
        cards:
        - type: custom:milesight-table-card
          preset: tanks
          title: false
        - type: markdown
          content: '<small>A row turns red on a sudden drop (theft or leak) and amber when low – press the tank''s *Clear sudden-drop alarm* button once checked.</small>

            '
      - heading: Level trends
        icon: mdi:chart-line
        cards:
        - type: custom:milesight-trendline-grid-card
          trend: tank
          columns: 2
      - heading: Supply and refills
        icon: mdi:calendar-clock
        cards:
        - type: custom:milesight-tank-supply-card
      - heading: Flood and early warning
        icon: mdi:home-flood
        cards:
        - type: custom:milesight-flood-card
      - heading: Drinking troughs
        icon: mdi:water-well
        cards:
        - type: custom:milesight-trough-card
