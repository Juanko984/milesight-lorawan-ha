# Milesight LoRaWAN – water level (tanks, silos, dams) and alerts
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# No entity ids to edit: the cards find the devices themselves. Installed by the integration, a "Live" view with
# per-tank gauges, sliders and the 30-day level history for the site's actual tanks is added after this Overview.
title: Water
views:
  - title: Overview
    path: tanks
    icon: mdi:water-percent
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-page-header
            grid_options: {columns: full}
            title: Water
            subtitle: Levels, days of supply, usage and leaks across every tank and silo
            icon: mdi:water-percent
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Supply at a glance
            icon: mdi:view-dashboard-outline
          - type: custom:milesight-tank-band
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Needs attention
            icon: mdi:bell-alert
          # Live open alerts (low / critical level, leak / sudden drop, sensor offline) with acknowledge / snooze.
          - type: custom:milesight-alerts-card
            title: false
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Tanks and silos
            icon: mdi:storage-tank
          - type: custom:milesight-table-card
            preset: tanks
            title: false
            grid_options: {columns: full}
          - type: markdown
            grid_options: {columns: full}
            content: |
              <small>A row turns red on a sudden drop (theft or leak) and amber when low – press the tank's *Clear sudden-drop alarm* button once checked.</small>
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Supply and refills
            icon: mdi:calendar-clock
          - type: custom:milesight-tank-supply-card
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Flood and early warning
            icon: mdi:home-flood
          # Water-body level in drains, culverts, under bridges or rivers (EM500-UDL / radar). Set the device's
          # purpose to "Flood / drain level". Rises toward a danger line; raises a flood warning in time to act.
          - type: custom:milesight-flood-card
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Drinking troughs
            icon: mdi:water-well
          # Animal water troughs: a float switch on an EM300-MCS contact (open = empty). Set the device's
          # purpose to "Water trough". Shows nothing until a trough is set up.
          - type: custom:milesight-trough-card
            grid_options: {columns: full}
