# Milesight LoRaWAN – Chicken coop
# Set up each coop device two ways and this page fills itself in:
#   1. Purpose (device → Configure → Purpose): Coop drinker (water), Coop feeder (feed), Coop pop-hole / door,
#      Coop climate (temp / CO₂ / humidity). These set poultry-friendly alert defaults (frost at 2 °C, pop-hole
#      left-open 15 min) and make this page install itself.
#   2. Area: put those same devices (plus the EM500-LGT light sensor and the UC relay for lights / heater) in a
#      Home Assistant area called "Chicken coop". Every card below finds the devices by that area NAME (not its id),
#      so there is nothing to edit. Using a different area name? Change every `area: Chicken coop` below to match.
# Lights and heating are automated by the two coop blueprints (Settings → Automations → Blueprints → Import).
title: Chicken coop
views:
  - title: Coop
    path: coop
    icon: mdi:egg
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-page-header
            grid_options: {columns: full}
            title: Chicken coop
            subtitle: Climate, light, feed, water and the pop-hole door
            icon: mdi:egg
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: At a glance
            icon: mdi:view-dashboard-outline
          # Comfort score, temperature, humidity and CO₂ for the coop area in one row.
          - type: custom:milesight-table-card
            preset: comfort
            title: false
            area: Chicken coop
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Climate
            icon: mdi:home-thermometer
          # AM air monitor(s) in the coop (AM107 …): a chip for every property it measures — temperature, humidity,
          # CO₂, light — and the trend for whichever chip you tap. Hides itself when there is no AM sensor here.
          - type: custom:milesight-air-quality-card
            area: Chicken coop
            purpose: coop_climate
            grid_options: {columns: full}
          # EM300 temp / humidity / door / leak sensors in the coop: numeric chips drive the trend, door / leak show
          # status. Hides itself when there are none.
          - type: custom:milesight-environment-card
            area: Chicken coop
            purpose: coop_climate,coop_door
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: CO₂ trend
            icon: mdi:molecule-co2
          # One trendline per CO₂ sensor in the coop — flashes when CO₂ climbs over its limit. Found by the coop
          # area OR the Coop climate purpose, so either way of setting a device up works.
          - type: custom:milesight-trendline-grid-card
            trend: air
            area: Chicken coop
            purpose: coop_climate
            columns: 2
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Light level
            icon: mdi:brightness-6
          # One trendline per light sensor in the coop (EM500-LGT, AM light, UC analog light). Found by the coop
          # area OR the Coop light-sensor purpose — set either on the EM500-LGT and it shows here.
          - type: custom:milesight-trendline-grid-card
            trend: light
            area: Chicken coop
            purpose: coop_light
            columns: 2
            empty:
              icon: mdi:lightbulb-off-outline
              title: No light sensor in the coop yet
              hint: Put an EM500-LGT (or an AM monitor's light channel) in the Chicken coop area, or set its purpose to Coop light sensor, and it shows here.
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Coop sensors
            icon: mdi:chart-multiple
          # Every reading in the coop on one grid — temperature, humidity, CO₂, light, tank levels, and a UC300's
          # PT100 / analog channels — one trendline each. `trend: "*"` matches any entity the integration tagged for
          # trending, kept to the coop by the area OR any coop purpose. This is the catch-all; the sections above are
          # the focused views.
          - type: custom:milesight-trendline-grid-card
            trend: "*"
            area: Chicken coop
            purpose: coop_drinker,coop_feeder,coop_door,coop_climate,coop_light,coop_controller
            columns: 3
            empty:
              icon: mdi:chart-line
              title: No coop sensors reporting yet
              hint: Put your coop devices (climate, light, tank, UC300) in the Chicken coop area or give them a Coop purpose, and every reading shows here.
            grid_options: {columns: full}
      - type: grid
        cards:
          - type: heading
            heading: Feed & water
            icon: mdi:silo
          # Drinkers / feeders set up as a tank or silo (device → Configure → Tank or silo): the same cutaway
          # model and supply table as the Water page, scoped to the coop. Hide themselves until there is a tank here.
          - type: custom:milesight-level-model-card
            area: Chicken coop
            grid_options: {columns: full}
          - type: custom:milesight-table-card
            preset: tanks
            title: false
            area: Chicken coop
            grid_options: {columns: full}
      - type: grid
        cards:
          - type: heading
            heading: Pop-hole door
            icon: mdi:door
          # The pop-hole contact (WS301 / EM300-MCS): live Open / Closed, how long it has been open, today's open
          # count and the longest open — found by the coop area or the Coop pop-hole purpose.
          - type: custom:milesight-door-card
            area: Chicken coop
            purpose: coop_door
            empty:
              icon: mdi:door
              title: No pop-hole contact in the coop yet
              hint: Add a magnet contact (WS301 / EM300-MCS), put it in the Chicken coop area or set its purpose to Coop pop-hole, and its state and open history show here.
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Lights & heater — automatic
            icon: mdi:home-lightning-bolt
          # The gateway runs the coop lights (by daylight) and heater (by temperature) itself: pick the UC relay
          # and the sensor for each, set the thresholds, and it switches them. The heater turns off if its probe
          # stops reporting. Assign the UC relay device the "Coop lights / heater controller" purpose (or put it
          # in the Chicken coop area) so it is here to pick. No blueprint or automation to set up.
          # `area` keeps the relay / sensor pickers to coop devices only (devices in the Chicken coop area, or with
          # a coop purpose) instead of every switch and sensor in Home Assistant.
          - type: custom:milesight-coop-control-card
            area: Chicken coop
            grid_options: {columns: full}
