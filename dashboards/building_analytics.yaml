# Milesight LoRaWAN – building analytics dashboard
# Settings → Dashboards → Add dashboard → "New dashboard from scratch" → ⋮ → Raw configuration editor → paste.
# Works without editing: it finds every "<area> comfort" / "<area> occupancy" sensor the integration creates.
# Areas come from the Home Assistant area of each device (set during onboarding or on the device page).
title: Building analytics
views:
  - title: Areas
    path: areas
    cards:
      - type: markdown
        title: Comfort per area
        content: |
          {% set rows = states.sensor | selectattr('attributes.kind', 'defined')
             | selectattr('attributes.kind', 'eq', 'comfort') | selectattr('attributes.area', 'defined') | list %}
          {% if not rows %}No area comfort sensors yet – assign devices with temperature / humidity / CO2 to areas.{% else %}
          | Area | Comfort | Temp | RH | CO2 |
          |---|---|---|---|---|
          {% for s in rows | sort(attribute='attributes.area') %}{% set v = s.state | int(-1) %}| {{ s.attributes.area }} | {{ '🟢' if v >= 80 else ('🟡' if v >= 50 else ('🔴' if v >= 0 else '⚪')) }} {{ s.state if v >= 0 else '–' }} | {{ s.attributes.temperature if s.attributes.temperature is not none else '' }} | {{ s.attributes.humidity if s.attributes.humidity is not none else '' }} | {{ s.attributes.co2 if s.attributes.co2 is not none else '' }} |
          {% endfor %}{% endif %}
      - type: markdown
        title: Occupancy today (share of each hour occupied)
        content: |
          {% set rows = states.sensor | selectattr('attributes.hourly_today', 'defined') | list %}
          {% if not rows %}No area occupancy sensors yet – assign people counters / PIR / desk sensors to areas.{% else %}
          {% set hours = range(7, 20) %}
          | Area | Now | Today |{% for h in hours %} {{ '%02d' % h }} |{% endfor %}
          |---|---|---|{% for h in hours %}---|{% endfor %}
          {% for s in rows | sort(attribute='attributes.area') %}| {{ s.attributes.area }} | {{ '🧑' if s.attributes.occupied_now else '·' }}{{ (' ' ~ s.attributes.people_now) if s.attributes.people_now is not none else '' }} | {{ s.state if s.state not in ('unknown', 'unavailable') else '–' }} % |{% for h in hours %}{% set p = s.attributes.hourly_today[h] %} {{ '⬜' if p is none else ('🟥' if p >= 75 else ('🟧' if p >= 50 else ('🟨' if p >= 25 else ('🟩' if p > 0 else '⬛')))) }} |{% endfor %}
          {% endfor %}

          ⬛ empty · 🟩 <25 % · 🟨 25–50 % · 🟧 50–75 % · 🟥 >75 % · ⬜ no data{% endif %}
      - type: markdown
        title: Occupancy yesterday
        content: |
          {% set rows = states.sensor | selectattr('attributes.hourly_yesterday', 'defined') | list %}
          {% set hours = range(7, 20) %}
          | Area |{% for h in hours %} {{ '%02d' % h }} |{% endfor %}
          |---|{% for h in hours %}---|{% endfor %}
          {% for s in rows | sort(attribute='attributes.area') %}| {{ s.attributes.area }} |{% for h in hours %}{% set p = s.attributes.hourly_yesterday[h] %} {{ '⬜' if p is none else ('🟥' if p >= 75 else ('🟧' if p >= 50 else ('🟨' if p >= 25 else ('🟩' if p > 0 else '⬛')))) }} |{% endfor %}
          {% endfor %}
      - type: markdown
        title: Utilisation today (opening hours)
        content: |
          {% set rows = states.sensor | selectattr('attributes.utilisation_today', 'defined') | list %}
          | Area | Utilisation |
          |---|---|
          {% for s in rows | sort(attribute='attributes.area') %}| {{ s.attributes.area }} | {{ s.attributes.utilisation_today if s.attributes.utilisation_today is not none else '–' }} % |
          {% endfor %}
