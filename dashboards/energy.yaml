# Milesight LoRaWAN – power & energy (air conditioners, lighting, geysers, compressors, motors, mains)
# Installed by the integration when a clamp or socket is given an energy / HVAC purpose (device → Configure → Purpose).
# No entity ids to edit: the cards find the loads and the mains board themselves.
title: Energy & HVAC
views:
  - title: Power
    path: loads
    icon: mdi:lightning-bolt
    type: sections
    max_columns: 3
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-page-header
            grid_options: {columns: full}
            title: Power & Energy
            subtitle: Mains, demand and every load
            icon: mdi:lightning-bolt
      - type: grid
        column_span: 3
        cards:
          - type: custom:milesight-recipe-strip-card
            category: [energy]
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Running costs
            icon: mdi:cash-multiple
          # Spend today / this month / projected with a live ticker and a cost leaderboard.
          # Set the tariffs on the gateway → Configure → Running costs. Hidden until a tariff is set.
          - type: custom:milesight-running-costs-card
            title: false
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Demand
            icon: mdi:gauge
          - type: custom:milesight-load-summary-card
            title: false
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Mains board
            icon: mdi:transmission-tower
          # Live / outage, the three phase currents, phase imbalance and total load — from a CT303 / CT310.
          - type: custom:milesight-mains-card
            title: false
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Current clamps
            icon: mdi:flash
          # One card per CT clamp: phase currents (L1/L2/L3) as chips that drive the trend, total current, estimated
          # power and phase imbalance. Single-channel clamps show current / power / energy. Hides itself when absent.
          - type: custom:milesight-energy-card
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Thermostats
            icon: mdi:thermostat
          # WT thermostats / radiator valves: current temperature, −/+ setpoint, mode and fan controls, valve opening
          # and a temperature trend. Hides itself when there are no WT devices.
          - type: custom:milesight-climate-card
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Lights & switches
            icon: mdi:lightbulb-group
          # WS558 / smart sockets / wall switches: per-channel on/off toggles and all-on / all-off. Self-hiding.
          - type: custom:milesight-light-card
            grid_options: {columns: full}
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Loads
            icon: mdi:power-plug
          - type: custom:milesight-table-card
            preset: loads
            title: false
            grid_options: {columns: full}
          - type: markdown
            grid_options: {columns: full}
            content: |
              <small>A red row ran too long or has not run · amber for after-hours or service due.</small>
