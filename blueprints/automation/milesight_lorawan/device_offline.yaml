blueprint:
  name: Milesight – device offline / back online
  description: >
    Notify when Milesight LoRaWAN devices stop reporting (their *Online* sensor turns off) and, optionally,
    when they come back. The offline time is the device's *Offline gap* setting (default 120 min).
  domain: automation
  source_url: https://github.com/Juanko984/milesight-lorawan-ha/blob/main/blueprints/automation/milesight_lorawan/device_offline.yaml
  input:
    devices:
      name: Online sensors
      description: The "Online" sensors of the devices to watch (leave the list long – one automation can watch all).
      selector:
        entity:
          multiple: true
          filter:
            - integration: milesight_lorawan
              domain: binary_sensor
              device_class: connectivity
    offline_actions:
      name: When a device goes offline
      default:
        - action: persistent_notification.create
          data:
            title: "LoRaWAN device offline"
            message: "{{ device_name }} has not reported since {{ last_seen }}."
      selector:
        action: {}
    online_actions:
      name: When it is back online (optional)
      default: []
      selector:
        action: {}
mode: queued
max: 50
trigger:
  - trigger: state
    entity_id: !input devices
    from: "on"
    to: "off"
    id: offline
  - trigger: state
    entity_id: !input devices
    from: "off"
    to: "on"
    id: online
variables:
  device_name: "{{ device_attr(trigger.entity_id, 'name_by_user') or device_attr(trigger.entity_id, 'name') }}"
  last_seen: "{{ trigger.from_state.last_changed.strftime('%d %b %H:%M') if trigger.from_state else 'unknown' }}"
action:
  - choose:
      - conditions: "{{ trigger.id == 'offline' }}"
        sequence: !input offline_actions
      - conditions: "{{ trigger.id == 'online' }}"
        sequence: !input online_actions
